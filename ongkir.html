<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ongkos Kirim</title>
    
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat Leaflet.js untuk peta interaktif dari CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style untuk container peta agar memiliki tinggi */
        #map {
            height: 450px;
            border-radius: 0.5rem;
        }
        /* Style untuk loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 md:p-8">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Kalkulator Ongkos Kirim</h1>
                <p class="text-gray-600 mb-6">Ditenagai oleh OpenStreetMap. Masukkan alamat untuk menghitung estimasi biaya.</p>

                <!-- Form Input Alamat -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="origin-input" class="block text-sm font-medium text-gray-700 mb-1">Alamat Awal</label>
                        <input id="origin-input" type="text" value="Grinting Brebes" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label for="destination-input" class="block text-sm font-medium text-gray-700 mb-1">Alamat Tujuan</label>
                        <input id="destination-input" type="text" placeholder="Contoh: Stasiun Bogor" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                    </div>
                </div>

                <button id="calculate-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 flex items-center justify-center gap-2">
                    <span id="btn-text">Hitung Ongkos Kirim</span>
                    <div id="loader" class="loader hidden"></div>
                </button>
            </div>

            <!-- Pesan Error -->
            <div id="error-message" class="p-4 mx-8 mb-4 bg-red-100 text-red-700 rounded-lg hidden"></div>

            <!-- Hasil Perhitungan -->
            <div id="output" class="p-6 md:p-8 bg-gray-50 border-t border-gray-200 hidden">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Hasil Perhitungan</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                    <div class="bg-white p-4 rounded-lg border">
                        <p class="text-sm text-gray-500">Jarak</p>
                        <p id="distance" class="text-lg font-semibold text-blue-600">-</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border">
                        <p class="text-sm text-gray-500">Estimasi Waktu</p>
                        <p id="duration" class="text-lg font-semibold text-blue-600">-</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-blue-500 shadow-md">
                        <p class="text-sm text-gray-500">Estimasi Ongkos Kirim</p>
                        <p id="cost" class="text-2xl font-bold text-green-600">-</p>
                    </div>
                </div>
            </div>

            <!-- Container untuk Peta -->
            <div class="p-6 md:p-8 bg-gray-50 border-t border-gray-200">
                 <div id="map" class="w-full bg-gray-200"></div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi peta Leaflet, berpusat di Indonesia
        const map = L.map('map').setView([-2.5489, 118.0149], 5);
        
        // Menambahkan layer peta dari OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Layer group untuk menampung marker dan rute
        let routeLayer = L.layerGroup().addTo(map);

        // Referensi elemen UI
        const calculateBtn = document.getElementById('calculate-btn');
        const btnText = document.getElementById('btn-text');
        const loader = document.getElementById('loader');
        const outputDiv = document.getElementById('output');
        const errorMessageDiv = document.getElementById('error-message');

        // Event listener untuk tombol "Hitung"
        calculateBtn.addEventListener('click', handleCalculation);

        /**
         * Fungsi utama yang menangani proses perhitungan
         */
        async function handleCalculation() {
            const originQuery = document.getElementById('origin-input').value;
            const destinationQuery = document.getElementById('destination-input').value;

            if (!originQuery || !destinationQuery) {
                showError('Harap isi alamat awal dan tujuan.');
                return;
            }

            // Tampilkan loading dan sembunyikan hasil sebelumnya
            setLoading(true);
            hideError();
            outputDiv.classList.add('hidden');
            routeLayer.clearLayers();

            try {
                // 1. Dapatkan koordinat untuk alamat awal dan tujuan
                const originCoords = await geocodeAddress(originQuery);
                const destinationCoords = await geocodeAddress(destinationQuery);

                if (!originCoords || !destinationCoords) {
                    showError('Satu atau kedua alamat tidak dapat ditemukan. Coba gunakan nama tempat yang lebih spesifik.');
                    setLoading(false);
                    return;
                }
                
                // 2. Dapatkan rute dan jarak antara dua koordinat
                const routeData = await getRoute(originCoords, destinationCoords);

                // 3. Hitung ongkos kirim
                const cost = calculateShippingCost(routeData.distance);

                // 4. Tampilkan semua hasil
                displayResults(routeData, cost);
                drawRoute(routeData.geometry);
                
                // Pusatkan peta pada rute yang baru digambar
                const routeBounds = L.geoJSON(routeData.geometry).getBounds();
                map.fitBounds(routeBounds.pad(0.1));

            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan saat mengambil data rute. Silakan coba lagi.');
            } finally {
                setLoading(false);
            }
        }

        /**
         * Mengubah alamat menjadi koordinat (lat, lon) menggunakan Nominatim API
         * @param {string} address - Alamat yang akan dicari.
         * @returns {Promise<object|null>} - Objek berisi {lat, lon} atau null jika tidak ditemukan.
         */
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=id&limit=1`;
            const response = await fetch(url);
            const data = await response.json();

            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
            return null;
        }

        /**
         * Mendapatkan rute antara dua titik menggunakan OSRM (Open Source Routing Machine)
         * @param {object} startCoords - Koordinat awal {lat, lon}.
         * @param {object} endCoords - Koordinat akhir {lat, lon}.
         * @returns {Promise<object>} - Objek berisi jarak, durasi, dan geometri rute.
         */
        async function getRoute(startCoords, endCoords) {
            const url = `https://router.project-osrm.org/route/v1/driving/${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}?overview=full&geometries=geojson`;
            const response = await fetch(url);
            const data = await response.json();

            if (data.code !== 'Ok') {
                throw new Error(data.message || 'Tidak dapat menemukan rute.');
            }

            const route = data.routes[0];
            return {
                distance: route.distance, // dalam meter
                duration: route.duration, // dalam detik
                geometry: route.geometry, // GeoJSON untuk digambar di peta
            };
        }

        /**
         * FUNGSI UTAMA UNTUK MENGHITUNG ONGKOS KIRIM
         * Anda bisa mengubah logika perhitungan di dalam fungsi ini.
         * @param {number} distanceInMeters - Jarak dalam satuan meter.
         * @returns {number} - Total biaya pengiriman.
         */
        function calculateShippingCost(distanceInMeters) {
            const distanceInKm = distanceInMeters / 1000;
            let cost = 0;

            if (distanceInKm <= 5) {
                cost = 10000;
            } else if (distanceInKm > 5 && distanceInKm <= 10) {
                cost = 15000;
            } else if (distanceInKm > 10 && distanceInKm <= 20) {
                cost = 25000;
            } else {
                const baseCost = 25000;
                const additionalDistance = distanceInKm - 20;
                const costPerKm = 2000;
                cost = baseCost + (additionalDistance * costPerKm);
            }
            return Math.round(cost / 100) * 100;
        }

        /**
         * Menampilkan hasil perhitungan di UI
         * @param {object} routeData - Data rute dari OSRM.
         * @param {number} costValue - Biaya yang sudah dihitung.
         */
        function displayResults(routeData, costValue) {
            // Format jarak
            const distanceInKm = (routeData.distance / 1000).toFixed(2);
            document.getElementById('distance').textContent = `${distanceInKm} km`;

            // Format durasi
            const hours = Math.floor(routeData.duration / 3600);
            const minutes = Math.floor((routeData.duration % 3600) / 60);
            let durationText = '';
            if (hours > 0) durationText += `${hours} jam `;
            durationText += `${minutes} menit`;
            document.getElementById('duration').textContent = durationText;

            // Format biaya
            const formattedCost = new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(costValue);
            document.getElementById('cost').textContent = formattedCost;
            
            outputDiv.classList.remove('hidden');
        }

        /**
         * Menggambar rute dan marker di peta
         * @param {object} routeGeometry - Geometri rute dalam format GeoJSON.
         */
        function drawRoute(routeGeometry) {
            routeLayer.clearLayers(); // Hapus rute sebelumnya
            
            // Tambahkan garis rute
            const routeLine = L.geoJSON(routeGeometry, {
                style: {
                    color: '#3b82f6', // Biru
                    weight: 5,
                    opacity: 0.8
                }
            });
            routeLayer.addLayer(routeLine);

            // Tambahkan marker A (Awal) dan B (Akhir)
            const startPoint = routeGeometry.coordinates[0];
            const endPoint = routeGeometry.coordinates[routeGeometry.coordinates.length - 1];
            
            const startMarker = L.marker([startPoint[1], startPoint[0]]).bindPopup('<b>Titik Awal</b>');
            const endMarker = L.marker([endPoint[1], endPoint[0]]).bindPopup('<b>Titik Tujuan</b>');

            routeLayer.addLayer(startMarker);
            routeLayer.addLayer(endMarker);
        }

        // Fungsi utilitas untuk UI
        function setLoading(isLoading) {
            if (isLoading) {
                calculateBtn.disabled = true;
                btnText.classList.add('hidden');
                loader.classList.remove('hidden');
            } else {
                calculateBtn.disabled = false;
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        function showError(message) {
            errorMessageDiv.textContent = message;
            errorMessageDiv.classList.remove('hidden');
        }

        function hideError() {
            errorMessageDiv.classList.add('hidden');
        }

    </script>
</body>
</html>
